kind = "web"
previewPath = "/"
title = "CONTROL DE BOBINAS"
description = "Aplicación táctil para gestionar el almacén de bobinas, las órdenes de producción, los restos y el historial de órdenes finalizadas en una fábrica."
version = "1.0.0"
id = "artifacts/control-bobinas"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23296

[services.development]
run = "pnpm --filter @workspace/control-bobinas run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/control-bobinas", "run", "build" ]
serve = "static"
publicDir = "artifacts/control-bobinas/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23296"
BASE_PATH = "/"
