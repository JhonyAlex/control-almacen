services:
  db:
    image: postgres:16-alpine
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-control_bobinas}
      POSTGRES_USER: ${POSTGRES_USER:-control_bobinas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      STATIC_DIR: /app/artifacts/control-bobinas/dist/public
      DRIZZLE_MIGRATIONS_DIR: /app/lib/db/drizzle
      DATABASE_URL: ${DATABASE_URL:?Define DATABASE_URL in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      GESTION_PEDIDOS_INTEGRATION_TOKEN: ${GESTION_PEDIDOS_INTEGRATION_TOKEN:-}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/readyz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 5

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-control-almacen_postgres_data}
