openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication and initial setup
  - name: users
    description: User management
  - name: orders
    description: Production orders
  - name: inventory
    description: Warehouse coils and remnants
  - name: integrations
    description: Service-to-service integrations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /readyz:
    get:
      operationId: readinessCheck
      tags: [health]
      summary: Readiness check
      description: Returns healthy only when the database is reachable.
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Database is not ready
  /auth/bootstrap:
    get:
      operationId: getBootstrapStatus
      tags: [auth]
      summary: Check whether the first administrator must be created
      responses:
        "200":
          description: Initial setup status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapStatus"
  /auth/session:
    get:
      operationId: getSession
      tags: [auth]
      summary: Get the current session
      responses:
        "200":
          description: Current authenticated user, if any
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
  /auth/register-first:
    post:
      operationId: registerFirstUser
      tags: [auth]
      summary: Create the first administrator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCredentialsInput"
      responses:
        "201":
          description: First administrator created and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedSessionResponse"
        "409":
          description: Initial setup has already been completed
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedSessionResponse"
        "401":
          description: Invalid credentials
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Sign out
      responses:
        "204":
          description: Signed out
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List users
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "403":
          description: Administrator required
    post:
      operationId: createUser
      tags: [users]
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCredentialsInput"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "409":
          description: Email already registered
  /users/{id}:
    patch:
      operationId: updateUser
      tags: [users]
      summary: Edit a user and assign its role
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateInput"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: User deleted
  /users/{id}/status:
    patch:
      operationId: setUserStatus
      tags: [users]
      summary: Activate or deactivate a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserStatusInput"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /users/{id}/password:
    post:
      operationId: resetUserPassword
      tags: [users]
      summary: Set a user's password
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordInput"
      responses:
        "204":
          description: Password updated
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List production orders
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/OrderStatus"
      responses:
        "200":
          description: Production orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductionOrder"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create a production order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductionOrder"
  /orders/{id}:
    patch:
      operationId: updateOrder
      tags: [orders]
      summary: Edit an active production order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductionOrder"
        "400":
          description: Only active orders can be edited
        "404":
          description: Order not found
    delete:
      operationId: deleteOrder
      tags: [orders]
      summary: Delete an active production order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted
        "404":
          description: Order not found
  /orders/{id}/blocked:
    patch:
      operationId: setOrderBlocked
      tags: [orders]
      summary: Block or unlock a production order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderBlockInput"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductionOrder"
        "400":
          description: Finalized orders cannot be blocked or unlocked
        "404":
          description: Order not found
  /orders/{id}/finalize:
    post:
      operationId: finalizeOrder
      tags: [orders]
      summary: Manually finalize a blocked production order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderFinalizeInput"
      responses:
        "200":
          description: Finalized order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductionOrder"
        "400":
          description: Only blocked orders can be manually finalized
        "404":
          description: Order not found
  /orders/reorder:
    patch:
      operationId: reorderOrders
      tags: [orders]
      summary: Set the priority order of all active production orders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderReorderInput"
      responses:
        "204":
          description: Order priority updated
        "409":
          description: Active orders changed before the reorder was saved
  /orders/{id}/coils:
    get:
      operationId: listOrderCoils
      tags: [orders]
      summary: List all coils belonging to an order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Order coils
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Coil"
  /inventory:
    get:
      operationId: listInventory
      tags: [inventory]
      summary: List available warehouse material
      responses:
        "200":
          description: Inventory and total meters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventorySummary"
  /inventory/coils:
    post:
      operationId: addManufacturedCoil
      tags: [inventory]
      summary: Add a manufactured coil against an active order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManufacturedCoilInput"
      responses:
        "201":
          description: Created coil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Coil"
        "400":
          description: Invalid meters or inactive order
  /inventory/remnants:
    post:
      operationId: addProductionRemnant
      tags: [inventory]
      summary: Add a production remnant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemnantInput"
      responses:
        "201":
          description: Created remnant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Coil"
  /inventory/{id}/consume:
    post:
      operationId: consumeInventoryItem
      tags: [inventory]
      summary: Mark a warehouse item as in factory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Consumed item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Coil"
        "404":
          description: Item not available
  /integrations/gestion-pedidos/nexus-orders:
    post:
      operationId: processNexusOrder
      tags: [integrations]
      summary: Receive order from GestionPedidosPigmea
      description: Process and group customer order into a production order
      security:
        - IntegrationBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NexusOrderInput"
      responses:
        "200":
          description: Order updated or already processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NexusOrderResponse"
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NexusOrderResponse"
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "409":
          description: Conflict
        "503":
          description: Service integration not configured
components:
  securitySchemes:
    IntegrationBearerAuth:
      type: http
      scheme: bearer
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    BootstrapStatus:
      type: object
      required: [needsSetup]
      properties:
        needsSetup:
          type: boolean
    User:
      type: object
      required: [id, nombre, email, role, isActive, creadoEn]
      properties:
        id:
          type: number
        nombre:
          type: string
        email:
          type: string
        role:
          $ref: "#/components/schemas/UserRole"
        isActive:
          type: boolean
        creadoEn:
          type: string
          format: date-time
    UserCredentialsInput:
      type: object
      required: [nombre, email, password]
      properties:
        nombre:
          type: string
          minLength: 1
        email:
          type: string
        password:
          type: string
          minLength: 12
        role:
          $ref: "#/components/schemas/UserRole"
    UserRole:
      type: string
      enum: [ADMIN, USER]
    UserUpdateInput:
      type: object
      required: [nombre, email, role]
      properties:
        nombre:
          type: string
          minLength: 1
        email:
          type: string
        role:
          $ref: "#/components/schemas/UserRole"
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
    PasswordInput:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 12
    UserStatusInput:
      type: object
      required: [isActive]
      properties:
        isActive:
          type: boolean
    SessionResponse:
      type: object
      required: [authenticated, user]
      properties:
        authenticated:
          type: boolean
        user:
          anyOf:
            - $ref: "#/components/schemas/User"
            - type: "null"
    AuthenticatedSessionResponse:
      type: object
      required: [authenticated, user]
      properties:
        authenticated:
          type: boolean
          const: true
        user:
          $ref: "#/components/schemas/User"
    OrderStatus:
      type: string
      enum: [ACTIVA, BLOQUEADA, FINALIZADA]
    CoilStatus:
      type: string
      enum: [DISPONIBLE, EN FÁBRICA]
    Camisa:
      type: string
      enum:
        [
          400,
          475,
          520,
          22-6-22,
          21-8-21,
          40-6-40,
          40-8-40,
          47-5-47,
          47-8-47,
          52-8-52,
        ]
    Material:
      type: string
      enum: [OPP, OPP RECICLADO]
    CoilCharacteristics:
      type: object
      required: [ancho, micras, camisa, material]
      properties:
        ancho:
          type: number
        micras:
          type: number
        camisa:
          $ref: "#/components/schemas/Camisa"
        material:
          $ref: "#/components/schemas/Material"
    OrderInput:
      allOf:
        - $ref: "#/components/schemas/CoilCharacteristics"
        - type: object
          required: [metrosNecesarios]
          properties:
            metrosNecesarios:
              type: number
              exclusiveMinimum: 0
    OrderBlockInput:
      type: object
      required: [blocked]
      properties:
        blocked:
          type: boolean
    OrderFinalizeInput:
      type: object
      properties:
        nota:
          type: string
    OrderReorderInput:
      type: object
      required: [orderIds]
      properties:
        orderIds:
          type: array
          minItems: 1
          items:
            type: number
    OrderOrigin:
      type: string
      enum: [MANUAL, GESTION_PEDIDOS]
    RelatedPedido:
      type: object
      required: [id, pedidoId, numeroPedidoCliente, metros, vinculadoEn]
      properties:
        id:
          type: number
        pedidoId:
          type: string
        numeroPedidoCliente:
          type: string
        metros:
          type: number
        vinculadoEn:
          type: string
          format: date-time
    NexusOrderInput:
      type: object
      required:
        [
          eventId,
          pedidoId,
          numeroPedidoCliente,
          metros,
          bobinaMadre,
          camisa,
          tipoMaterial,
          micras,
        ]
      properties:
        eventId:
          type: string
        pedidoId:
          type: string
          minLength: 1
        numeroPedidoCliente:
          type: string
          minLength: 1
        metros:
          type: number
          exclusiveMinimum: 0
        bobinaMadre:
          type: number
          exclusiveMinimum: 0
        camisa:
          type: string
          minLength: 1
        tipoMaterial:
          type: string
          minLength: 1
        micras:
          type: number
          exclusiveMinimum: 0
    NexusOrderResponse:
      type: object
      required: [success, action, orderId, totalMetros, eventId]
      properties:
        success:
          type: boolean
        action:
          type: string
          enum: [ORDER_CREATED, ORDER_UPDATED, ALREADY_PROCESSED]
        orderId:
          type: number
        totalMetros:
          type: number
        eventId:
          type: string
    ProductionOrder:
      type: object
      required:
        - id
        - ancho
        - micras
        - camisa
        - material
        - metrosNecesarios
        - metrosFabricados
        - metrosPendientes
        - estado
        - origen
        - pedidosRelacionados
        - creadoEn
        - finalizadaEn
        - nota
      properties:
        id:
          type: number
        ancho:
          type: number
        micras:
          type: number
        camisa:
          type: string
        material:
          type: string
        metrosNecesarios:
          type: number
        metrosFabricados:
          type: number
        metrosPendientes:
          type: number
        estado:
          $ref: "#/components/schemas/OrderStatus"
        origen:
          $ref: "#/components/schemas/OrderOrigin"
        pedidosRelacionados:
          type: array
          items:
            $ref: "#/components/schemas/RelatedPedido"
        creadoEn:
          type: string
          format: date-time
        finalizadaEn:
          type: ["string", "null"]
          format: date-time
        nota:
          type: ["string", "null"]
    ManufacturedCoilInput:
      type: object
      required: [ordenId, metros]
      properties:
        ordenId:
          type: number
        metros:
          type: number
          exclusiveMinimum: 0
    RemnantInput:
      allOf:
        - $ref: "#/components/schemas/CoilCharacteristics"
        - type: object
          required: [metros]
          properties:
            metros:
              type: number
              exclusiveMinimum: 0
    Coil:
      allOf:
        - type: object
          required: [id, tipo, metros, estado, creadoEn]
          properties:
            id:
              type: number
            tipo:
              type: string
              enum: [BOBINA, RESTO]
            metros:
              type: number
            estado:
              $ref: "#/components/schemas/CoilStatus"
            ordenId:
              type: ["number", "null"]
            pedidosRelacionados:
              type: array
              items:
                $ref: "#/components/schemas/RelatedPedido"
            creadoEn:
              type: string
              format: date-time
        - $ref: "#/components/schemas/CoilCharacteristics"
    InventorySummary:
      type: object
      required: [totalMetros, items]
      properties:
        totalMetros:
          type: number
        items:
          type: array
          items:
            $ref: "#/components/schemas/Coil"
